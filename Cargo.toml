[package]
name = "waycap"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
chrono = "0.4.39"
config = "0.15.11"
directories = "6.0.0"
ffmpeg-next = { version = "8.1.x", features = ["codec", "format"] }
log = "0.4.25"
pipewire = { version = "0.10.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_derive = "1.0.219"
simple-logging = "2.0.2"
tokio = { version = "1.43.0", features = ["full"] }
toml = "0.8.20"
zbus = { version = "5.3.1", features = ["tokio"] }
waycap-rs = { version = "3.0.0", features = ["nvidia", "vulkan"] }
crossbeam = "0.8.4"
clap = { version = "4.5.45", features = ["derive"] }

[profile.dev]
debug = true
opt-level = 0
