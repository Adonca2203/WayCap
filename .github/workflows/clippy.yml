name: Clippy & Test Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu24.04
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          apt-get update
          apt-get install -y pipewire libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavdevice-dev \
            libavfilter-dev \
            libwayland-dev \
            libwayland-client0 \
            wayland-protocols \
            pkg-config \
            curl \
            build-essential \
            libssl-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linting
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu24.04
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          apt-get update
          apt-get install -y pipewire libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavdevice-dev \
            libavfilter-dev \
            libwayland-dev \
            libwayland-client0 \
            wayland-protocols \
            pkg-config \
            curl \
            build-essential \
            libssl-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Verify CUDA installation
        run: nvcc --version

      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.6.0-devel-ubuntu24.04
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          apt-get update
          apt-get install -y pipewire libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavdevice-dev \
            libavfilter-dev \
            libwayland-dev \
            libwayland-client0 \
            wayland-protocols \
            pkg-config \
            curl \
            build-essential \
            libssl-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Verify CUDA installation
        run: nvcc --version

      - run: cargo test
